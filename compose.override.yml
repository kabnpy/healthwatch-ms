services:
  db:
    restart: "no"
    ports:
      - "5432:5432"

  mailpit:
    restart: "no"
    ports:
      - "1080:8025"
      - "1025:1025"

  adminer:
    restart: "no"
    ports:
      - "8080:8080"

  backend:
    restart: "no"
    ports:
      - "8000:8000"
    environment:
      POSTGRES_SERVER: "db"
      SMTP_HOST: "mailpit"
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: "noreply@example.com"
