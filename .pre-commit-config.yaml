# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-added-large-files
      - id: check-toml
      - id: check-yaml
        args:
          - --unsafe
      - id: end-of-file-fixer
        exclude: |
            (?x)^(
                frontend/src/client/.*|
                backend/app/email-templates/build/.*
            )$
      - id: trailing-whitespace
        exclude: ^frontend/src/client/.*

  - repo: local
    hooks:
      - id: check-commit-msg
        name: conventional commit message check
        entry: python3 scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
        always_run: true

      - id: local-biome-check
        name: biome check
        entry: bash -c 'cd frontend && (bun run lint || npm run lint)'
        language: system
        types: [text]
        files: ^frontend/

      - id: local-ruff-check
        name: ruff check
        entry: bash -c 'cd backend && (uv run ruff check --force-exclude --fix --exit-non-zero-on-fix || ./.venv/bin/ruff check --force-exclude --fix --exit-non-zero-on-fix)'
        require_serial: true
        language: system
        types: [python]

      - id: local-ruff-format
        name: ruff format
        entry: bash -c 'cd backend && (uv run ruff format --force-exclude --check || ./.venv/bin/ruff format --force-exclude --check)'
        require_serial: true
        language: system
        types: [python]
